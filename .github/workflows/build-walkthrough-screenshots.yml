name: Build walkthrough screenshots

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/testing/visuals/**"

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Start backend from the real repository
        shell: bash
        run: |
          git clone --depth 1 https://github.com/faizansaiyed123/cleanflow_backend.git ../cleanflow_backend
          cd ../cleanflow_backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python seed.py
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/cleanflow-backend.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend
        run: npm ci

      - name: Start real frontend
        shell: bash
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/cleanflow-frontend.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:5173/ >/dev/null

      - name: Install Playwright and Firefox
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps firefox

      - name: Capture the complete product walkthrough
        run: node scripts/capture-walkthrough.mjs

      - name: Commit the real screenshots
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/testing/visuals
          git commit -m "docs: add complete CleanFlow walkthrough screenshots" || exit 0
          git push origin HEAD:main

      - name: Remove the one-time capture workflow
        shell: bash
        run: |
          git rm -f .github/workflows/build-walkthrough-screenshots.yml scripts/capture-walkthrough.mjs
          git commit -m "chore: remove one-time walkthrough capture workflow"
          git push origin HEAD:main
